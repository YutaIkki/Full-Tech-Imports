<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Produto</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #f5f7ff;
            margin: 0;
            padding: 0;
        }

        header {
            background: #000066;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #000066;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 25px;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            display: block;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            min-height: 70px;
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            grid-column: span 2;
            padding: 12px;
            background: linear-gradient(90deg, #001a80, #0066ff);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #0033cc, #0080ff);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Editar Produto</h1>
        <a href="{{ url_for('dashboard') }}">Voltar ao Dashboard</a>
    </header>

    <main>
        <div class="container">
            <h2>Atualizar Produto</h2>

            <form action="{{ url_for('editar_produto', produto_id=produto.id) }}" method="POST">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" value="{{ produto.nome }}" required>
                </div>

                <div>
                    <label for="descricao">Descrição:</label>
                    <textarea id="descricao" name="descricao" required>{{ produto.descricao }}</textarea>
                </div>

                <div>
                    <label for="preco">Preço:</label>
                    <input type="number" id="preco" name="preco" value="{{ produto.preco }}" step="0.01" required>
                </div>

                <div>
                    <label for="preco_pix">Preço com PIX:</label>
                    <input type="number" id="preco_pix" name="preco_pix" value="{{ produto.preco_pix }}" step="0.01" required>
                </div>

                <div>
                    <label for="estoque">Estoque:</label>
                    <input type="number" id="estoque" name="estoque" value="{{ produto.estoque }}" required>
                </div>

                <div>
                    <label for="estoque_minimo">Estoque Mínimo:</label>
                    <input type="number" id="estoque_minimo" name="estoque_minimo" value="{{ produto.estoque_minimo }}" required>
                </div>

                <div class="full-width">
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria" required>
                        {% for categoria in categorias %}
                        <option value="{{ categoria.id }}" {% if categoria.id == produto.categoria_id %}selected{% endif %}>
                            {{ categoria.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit">Atualizar Produto</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Full Tech Imports</p>
    </footer>
</body>

</html>
