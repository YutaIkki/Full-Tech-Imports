<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Full Tech Imports</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo-section">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Full Tech Imports">
        <h1>Login</h1>
      </div>

      {% if error %}
      <div class="error-message">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST">
        <div class="form-group">
          <label>E-mail:</label>
          <input type="email" name="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="form-group">
          <label>Senha:</label>
          <div class="password-container">
            <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <svg class="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-password">
          <a href="{{ url_for('recuperar_senha') }}">Esqueci minha senha</a>
        </div>

        <button type="submit" class="login-btn">Entrar</button>
      </form>

      <p class="register-link">Ainda não tem conta?
        <a href="{{ url_for('register') }}">Cadastre-se</a>
      </p>
    </div>
  </div>

  <script>
    function togglePassword() {
      const senhaInput = document.getElementById('senha');
      const eyeIcon = document.querySelector('.eye-icon');
      
      if (senhaInput.type === 'password') {
        senhaInput.type = 'text';
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        senhaInput.type = 'password';
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    }
  </script>
</body>

</html>
