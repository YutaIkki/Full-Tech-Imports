<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Redefinir Senha - Full Tech Imports</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Full Tech Imports">
      <h1>Redefinir Senha</h1>

      {% if error %}
      <div class="error-message" style="color: red; text-align: center; margin-bottom: 10px;">
        {{ error }}
      </div>
      {% endif %}

      {% if success %}
      <div class="success-message" style="color: green; text-align: center; margin-bottom: 10px;">
        {{ success }}
      </div>
      {% endif %}

      <form method="POST">
        <label>Nova Senha:</label>
        <input type="password" name="nova_senha" required>

        <label>Confirmar Nova Senha:</label>
        <input type="password" name="confirmar_senha" required>

        <button type="submit">Redefinir Senha</button>
      </form>

      <p>
        <a href="{{ url_for('login') }}">Voltar para o Login</a>
      </p>
    </div>
  </div>
</body>

</html>
