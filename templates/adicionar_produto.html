<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Adicionar Produto - Full Tech Imports</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
    <script>
        function previewImagem(event) {
            const imagem = document.getElementById("preview");
            const file = event.target.files[0];
            if (file) {
                imagem.src = URL.createObjectURL(file);
                imagem.style.display = "block";
            }
        }
    </script>
</head>

<body>
    <header>
        <h1>Adicionar Produto</h1>
        <nav>
            <a href="{{ url_for('dashboard') }}" class="btn">Voltar</a>
        </nav>
    </header>

    <div class="admin-container">
        <div class="form-card">
            <h2>Novo Produto</h2>
            <form method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <div>
                        <label>Nome:</label>
                        <input type="text" name="nome" required>
                    </div>

                    <div>
                        <label>Preço:</label>
                        <input type="number" step="0.01" name="preco" required>
                    </div>

                    <div>
                        <label>Preço Pix:</label>
                        <input type="number" step="0.01" name="preco_pix">
                    </div>

                    <div>
                        <label>Estoque:</label>
                        <input type="number" name="estoque" required>
                    </div>

                    <div>
                        <label>Estoque mínimo:</label>
                        <input type="number" name="estoque_minimo" value="1">
                    </div>

                    <div>
                        <label>Categoria:</label>
                        <select name="categoria" required>
                            <option value="">Selecione...</option>
                            <option value="Motor">Motor</option>
                            <option value="Pneus">Pneus</option>
                            <option value="Freios">Freios</option>
                            <option value="Transmissão">Transmissão</option>
                            <option value="Suspensão">Suspensão</option>
                            <option value="Elétrica Automotiva">Elétrica Automotiva</option>
                            <option value="Lubrificantes e Aditivos">Lubrificantes e Aditivos</option>
                            <option value="Sistema de Combustível">Sistema de Combustível</option>
                        </select>
                    </div>

                    <div style="grid-column: span 2;">
                        <label>Descrição:</label>
                        <textarea name="descricao" placeholder="Descrição breve do produto"></textarea>
                    </div>

                    <div style="grid-column: span 2;">
                        <label>Imagem do Produto:</label>
                        <input type="file" name="imagem" accept="image/*">
                        <img id="preview" src="#" alt="Pré-visualização" style="display:none;">
                    </div>

                    <button type="submit" class="btn-salvar">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
    <footer>
        <p>&copy; 2025 Full Tech Imports</p>
    </footer>
</body>

</html>
